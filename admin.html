<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OutfitZone Admin V2</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4f1;color:#111;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:25px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.logo{display:flex;gap:10px;align-items:center;font-weight:800;letter-spacing:.05em}.mark{width:40px;height:40px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center}.panel{background:#fff;border:1px solid #e4e2dd;border-radius:20px;padding:22px;margin-bottom:18px}h1{font-size:32px;margin:0 0 8px}h2{font-size:21px;margin-top:0}.muted{color:#707070;font-size:14px;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.full{grid-column:1/-1}label{font-size:13px;font-weight:700}input,textarea,select{font:inherit;border:1px solid #d7d5d0;border-radius:11px;padding:12px;background:#fff;outline:none}textarea{min-height:85px;resize:vertical}.btn{border:0;border-radius:999px;padding:11px 16px;font-weight:700;cursor:pointer;background:#111;color:#fff}.btn.light{background:#fff;color:#111;border:1px solid #111}.btn.danger{background:#9d2f2f}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.notice{padding:12px;border-radius:12px;background:#f1f0ec;font-size:13px;margin-bottom:15px}.preview{width:130px;height:130px;border-radius:14px;background:#e5e2dc;display:grid;place-items:center;overflow:hidden;color:#777;font-size:12px;text-align:center}.preview img{width:100%;height:100%;object-fit:cover}.product-picker{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.pick{border:1px solid #ddd7ce;border-radius:12px;padding:10px;display:flex;gap:9px;align-items:center;background:#faf9f6}.pick img{width:52px;height:52px;object-fit:cover;border-radius:8px;background:#eee}.pick input{width:18px;height:18px}.pick small{color:#777}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{border:1px solid #ccc;border-radius:999px;padding:9px 13px;background:#fff;cursor:pointer}.tab.active{background:#111;color:#fff}.outfit-row{border-top:1px solid #eee;padding:14px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.row-title{font-weight:800}.row-meta{font-size:12px;color:#777;margin-top:4px}.row-actions{display:flex;gap:6px}.small{padding:8px 10px;font-size:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.product-picker{grid-template-columns:1fr}.top{align-items:flex-start}.outfit-row{display:block}.row-actions{margin-top:10px}}
</style></head><body><div class="wrap"><div class="top"><div class="logo"><span class="mark">OZ</span> OUTFITZONE</div><a href="index.html" class="btn light">Lihat Website</a></div><div class="panel"><h1>OutfitZone Admin</h1><p class="muted">Kelola produk dan gabungkan beberapa produk menjadi satu outfit.</p><div class="notice" id="authNotice">Memeriksa akses admin...</div></div>
<div class="panel" id="loginPanel"><h2>Login Admin</h2><div class="grid"><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div></div><div class="actions"><button class="btn" id="login">Login</button></div><p class="muted" id="loginStatus"></p></div>
<div id="app" style="display:none"><div class="tabs"><button class="tab active" id="tabOutfit">Kelola Outfit</button><button class="tab" id="tabProduct">Kelola Produk</button><button class="btn light" id="logout">Logout</button></div>
<section class="panel" id="outfitPanel"><h2 id="outfitFormTitle">Tambah Outfit</h2><div class="grid"><div class="field"><label>Nomor Outfit *</label><input id="outfitNo" type="number" min="1" placeholder="1"></div><div class="field"><label>Nama Outfit *</label><input id="outfitName" placeholder="Old Money Beige"></div><div class="field full"><label>Deskripsi</label><textarea id="outfitDesc" placeholder="Contoh: Look old money dengan warna olive, cream, dan brown."></textarea></div><div class="field full"><label>Foto Utama Outfit</label><input id="outfitImage" type="file" accept="image/*"><div class="preview" id="outfitPreview">Preview foto</div></div><div class="field full"><label>Pilih Produk Dalam Outfit</label><div class="product-picker" id="picker">Memuat produk...</div></div></div><div class="actions"><button class="btn" id="saveOutfit">Simpan Outfit</button><button class="btn light" id="cancelOutfit" style="display:none">Batal</button></div></section>
<section class="panel"><h2>Daftar Outfit</h2><div id="outfitList"></div></section>
<section class="panel" id="productPanel" style="display:none"><h2 id="productFormTitle">Tambah Produk</h2><div class="grid"><div class="field"><label>Nomor Produk *</label><input id="productNo" type="number" min="1"></div><div class="field"><label>Nama Produk *</label><input id="productName"></div><div class="field"><label>Kategori</label><input id="productCategory" placeholder="Baju / Celana / Sepatu / Aksesori"></div><div class="field"><label>Harga</label><input id="productPrice" type="number" min="0"></div><div class="field full"><label>Deskripsi</label><textarea id="productDesc"></textarea></div><div class="field"><label>Link TikTok Shop</label><input id="productTikTok" type="url"></div><div class="field"><label>Link Shopee</label><input id="productShopee" type="url"></div><div class="field full"><label>Foto Produk</label><input id="productImage" type="file" accept="image/*"><div class="preview" id="productPreview">Preview foto</div></div></div><div class="actions"><button class="btn" id="saveProduct">Simpan Produk</button><button class="btn light" id="cancelProduct" style="display:none">Batal</button></div><div id="productList" style="margin-top:20px"></div></section></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://fmortepukkawepghpcky.supabase.co";const SUPABASE_PUBLISHABLE_KEY="sb_publishable_AVsr83Rf46lBxDa23j26cQ_xrETIRKz";const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const $=id=>document.getElementById(id);let products=[],outfits=[],editOutfitId=null,oldOutfitImage='',outfitFile=null,editProductId=null,oldProductImage='',productFile=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function uploadImage(file,folder,number){const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=`${folder}/${Date.now()}_${number}.${ext}`;const {error}=await sb.storage.from('product-images').upload(path,file,{upsert:true,contentType:file.type});if(error)throw error;return sb.storage.from('product-images').getPublicUrl(path).data.publicUrl}
async function loadProducts(){const {data,error}=await sb.from('products').select('id,product_number,name,category,price,image_url,description,tiktok_url,shopee_url').order('product_number',{ascending:true});if(error){alert('Gagal memuat produk: '+error.message);return}products=data||[];renderPicker();renderProducts()}
function renderPicker(selected=[]){const s=new Set(selected);$('picker').innerHTML=products.length?products.map(p=>`<label class="pick"><input type="checkbox" value="${p.id}" ${s.has(p.id)?'checked':''}><span>${p.image_url?`<img src="${esc(p.image_url)}">`:'<div style="width:52px;height:52px;background:#eee;border-radius:8px"></div>'}</span><span><b>#${String(p.product_number).padStart(2,'0')} ${esc(p.name)}</b><br><small>${esc(p.category||'Lainnya')}</small></span></label>`).join(''):'Belum ada produk. Tambahkan produk dulu.'}
function resetOutfit(){editOutfitId=null;oldOutfitImage='';outfitFile=null;$('outfitNo').value='';$('outfitName').value='';$('outfitDesc').value='';$('outfitImage').value='';$('outfitPreview').textContent='Preview foto';$('outfitFormTitle').textContent='Tambah Outfit';$('cancelOutfit').style.display='none';renderPicker()}
function resetProduct(){editProductId=null;oldProductImage='';productFile=null;$('productNo').value='';$('productName').value='';$('productCategory').value='';$('productPrice').value='';$('productDesc').value='';$('productTikTok').value='';$('productShopee').value='';$('productImage').value='';$('productPreview').textContent='Preview foto';$('productFormTitle').textContent='Tambah Produk';$('cancelProduct').style.display='none'}
async function loadOutfits(){const {data,error}=await sb.from('outfits').select('id,outfit_number,name,description,image_url,outfit_products(product_id,sort_order,products(id,product_number,name))').order('outfit_number',{ascending:true});if(error){alert('Gagal memuat outfit: '+error.message);return}outfits=data||[];renderOutfits()}
function renderOutfits(){$('outfitList').innerHTML=outfits.length?outfits.map(o=>{const items=(o.outfit_products||[]).sort((a,b)=>a.sort_order-b.sort_order).map(x=>x.products).filter(Boolean);return `<div class="outfit-row"><div><div class="row-title">#${String(o.outfit_number).padStart(2,'0')} — ${esc(o.name)}</div><div class="row-meta">${items.length} produk: ${items.map(p=>esc(p.name)).join(', ')}</div></div><div class="row-actions"><button class="btn small" onclick="editOutfit(${o.id})">Edit</button><button class="btn danger small" onclick="deleteOutfit(${o.id})">Hapus</button></div></div>`}).join(''):'Belum ada outfit.'}
$('outfitImage').onchange=e=>{outfitFile=e.target.files[0]||null;if(outfitFile)$('outfitPreview').innerHTML=`<img src="${URL.createObjectURL(outfitFile)}">`};$('productImage').onchange=e=>{productFile=e.target.files[0]||null;if(productFile)$('productPreview').innerHTML=`<img src="${URL.createObjectURL(productFile)}">`};
$('saveOutfit').onclick=async()=>{const no=Number($('outfitNo').value),name=$('outfitName').value.trim();if(!no||!name)return alert('Nomor dan nama outfit wajib diisi.');const ids=[...document.querySelectorAll('#picker input:checked')].map(x=>Number(x.value));if(!ids.length)return alert('Pilih minimal 1 produk.');$('saveOutfit').disabled=true;try{let imageUrl=oldOutfitImage;if(outfitFile)imageUrl=await uploadImage(outfitFile,'outfits',no);const payload={outfit_number:no,name,description:$('outfitDesc').value.trim(),image_url:imageUrl||null,updated_at:new Date().toISOString()};let id=editOutfitId;if(id===null){const r=await sb.from('outfits').insert(payload).select('id').single();if(r.error)throw r.error;id=r.data.id}else{const r=await sb.from('outfits').update(payload).eq('id',id);if(r.error)throw r.error;await sb.from('outfit_products').delete().eq('outfit_id',id)}const rows=ids.map((product_id,i)=>({outfit_id:id,product_id,sort_order:i}));const r2=await sb.from('outfit_products').insert(rows);if(r2.error)throw r2.error;alert('Outfit tersimpan.');resetOutfit();await loadOutfits()}catch(e){alert('Gagal menyimpan outfit: '+e.message)}finally{$('saveOutfit').disabled=false}}
window.editOutfit=id=>{const o=outfits.find(x=>x.id===id);if(!o)return;editOutfitId=id;oldOutfitImage=o.image_url||'';outfitFile=null;$('outfitNo').value=o.outfit_number;$('outfitName').value=o.name||'';$('outfitDesc').value=o.description||'';$('outfitImage').value='';$('outfitPreview').innerHTML=oldOutfitImage?`<img src="${esc(oldOutfitImage)}">`:'Preview foto';$('outfitFormTitle').textContent='Edit Outfit #'+String(o.outfit_number).padStart(2,'0');$('cancelOutfit').style.display='inline-block';renderPicker((o.outfit_products||[]).map(x=>x.product_id));scrollTo({top:0,behavior:'smooth'})};window.deleteOutfit=async id=>{const o=outfits.find(x=>x.id===id);if(!o||!confirm('Hapus outfit #'+o.outfit_number+'?'))return;const r=await sb.from('outfits').delete().eq('id',id);if(r.error)return alert(r.error.message);await loadOutfits()};$('cancelOutfit').onclick=resetOutfit;
$('saveProduct').onclick=async()=>{const no=Number($('productNo').value),name=$('productName').value.trim();if(!no||!name)return alert('Nomor dan nama produk wajib diisi.');$('saveProduct').disabled=true;try{let imageUrl=oldProductImage;if(productFile)imageUrl=await uploadImage(productFile,'products',no);const payload={product_number:no,name,category:$('productCategory').value.trim()||'Lainnya',price:Number($('productPrice').value)||0,image_url:imageUrl||null,description:$('productDesc').value.trim(),tiktok_url:$('productTikTok').value.trim()||null,shopee_url:$('productShopee').value.trim()||null,updated_at:new Date().toISOString()};let r;if(editProductId===null)r=await sb.from('products').insert(payload);else r=await sb.from('products').update(payload).eq('id',editProductId);if(r.error)throw r.error;alert('Produk tersimpan.');resetProduct();await loadProducts()}catch(e){alert('Gagal menyimpan produk: '+e.message)}finally{$('saveProduct').disabled=false}};window.editProduct=id=>{const p=products.find(x=>x.id===id);if(!p)return;editProductId=id;oldProductImage=p.image_url||'';productFile=null;$('productNo').value=p.product_number;$('productName').value=p.name||'';$('productCategory').value=p.category||'';$('productPrice').value=p.price||'';$('productDesc').value=p.description||'';$('productTikTok').value=p.tiktok_url||'';$('productShopee').value=p.shopee_url||'';$('productImage').value='';$('productPreview').innerHTML=oldProductImage?`<img src="${esc(oldProductImage)}">`:'Preview foto';$('productFormTitle').textContent='Edit Produk #'+String(p.product_number).padStart(2,'0');$('cancelProduct').style.display='inline-block'};window.deleteProduct=async id=>{const p=products.find(x=>x.id===id);if(!p||!confirm('Hapus produk #'+p.product_number+'?'))return;const r=await sb.from('products').delete().eq('id',id);if(r.error)return alert(r.error.message);await loadProducts()};$('cancelProduct').onclick=resetProduct;
$('tabOutfit').onclick=()=>{$('outfitPanel').style.display='block';$('productPanel').style.display='none';$('tabOutfit').classList.add('active');$('tabProduct').classList.remove('active')};$('tabProduct').onclick=()=>{$('outfitPanel').style.display='none';$('productPanel').style.display='block';$('tabProduct').classList.add('active');$('tabOutfit').classList.remove('active')};$('login').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return alert('Email dan password wajib diisi.');const {error}=await sb.auth.signInWithPassword({email,password});if(error)return $('loginStatus').textContent='Login gagal: '+error.message;await updateAuth()};$('logout').onclick=async()=>{await sb.auth.signOut();await updateAuth()};async function updateAuth(){const {data:{session}}=await sb.auth.getSession();const logged=!!session;$('loginPanel').style.display=logged?'none':'block';$('app').style.display=logged?'block':'none';$('authNotice').textContent=logged?'✅ Login admin aktif. Data tersimpan di Supabase.':'🔒 Silakan login untuk mengelola katalog.';if(logged){await loadProducts();await loadOutfits()}}sb.auth.onAuthStateChange(()=>updateAuth());updateAuth();
</script></body></html>
